<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#04050F"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Will-AI"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Will-AI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Fira+Code:wght@400;500&family=Patrick+Hand&display=swap" rel="stylesheet"><style>html{color-scheme:dark;background:#04050F;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}[hidden]{display:none!important}:root{--ink:#E8ECFF;--ink2:#9AA6E8;--night:#04050F;--line:rgba(200,210,255,.3);--rgb:143,107,240;
--display:'Caveat Brush','Segoe Print','Bradley Hand',cursive;--body:'Patrick Hand','Segoe Print','Bradley Hand',cursive;--mono:'Fira Code',ui-monospace,Menlo,Consolas,monospace}
.k-teal{--rgb:52,195,217}.k-blue{--rgb:109,140,245}.k-violet{--rgb:143,107,240}.k-magenta{--rgb:192,96,232}.k-sky{--rgb:91,168,232}.k-indigo{--rgb:123,79,214}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse 80% 38% at -5% 10%,rgba(70,100,220,.5),transparent 70%),radial-gradient(ellipse 65% 34% at 108% 52%,rgba(176,58,214,.5),transparent 70%),radial-gradient(ellipse 80% 34% at 0% 102%,rgba(31,166,196,.45),transparent 70%),var(--night);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.35;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
.app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;min-width:0}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 0 22px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none;overscroll-behavior:contain}
#view::-webkit-scrollbar{display:none}
#view>*{flex:none}
.view-in{animation:vin .22s ease-out}
@keyframes vin{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
button,select,input,textarea{font-family:var(--body);color:var(--ink);font-size:18px}
button{cursor:pointer}
:focus-visible{outline:3px solid rgba(var(--rgb),.9);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.15}
h2{font-family:var(--display);font-weight:400;font-size:27px;line-height:1.15}
h3{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.15}
.muted{color:var(--ink2)}
.small{font-size:15px}
mark{background:rgba(var(--rgb),.38);color:inherit;padding:0 .3em;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ic{flex:none}.ic .c{fill:rgba(var(--rgb),.55)}.ic .p{fill:#0E1130}
/* verre teinté */
.rnd,.pill,.btn.col,.box.col,.tile,.flip,.notice,.row.k-teal,.row.k-blue,.row.k-violet,.row.k-magenta,.row.k-sky,.row.k-indigo{background:linear-gradient(145deg,rgba(var(--rgb),.45),rgba(var(--rgb),.12) 75%),rgba(10,12,34,.62);border:1.5px solid rgba(var(--rgb),.8);box-shadow:0 6px 22px rgba(var(--rgb),.28);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.topbar{display:flex;align-items:center;gap:10px;min-height:48px}
.tb-title{flex:1;min-width:0;font-family:var(--display);font-size:25px;line-height:1.1}
.rnd{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.rnd svg{display:block}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 12px;font-size:16px;line-height:1.35;box-shadow:none}
.pill.small{font-size:14px;padding:0 10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;width:100%;border:1.5px solid var(--line);border-radius:999px;background:rgba(14,16,44,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:6px 18px;font-size:19px;text-align:center;text-decoration:none;color:var(--ink)}
.btn.dark{background:linear-gradient(135deg,#7B4FD6,#5B3FE0);border-color:rgba(160,130,255,.9);box-shadow:0 6px 22px rgba(123,79,214,.45);color:#fff}
.btn.col{box-shadow:0 4px 16px rgba(var(--rgb),.32)}
.btn.sm{min-height:44px;font-size:17px;width:auto;padding:4px 16px}
.btn.ghost{border-style:dashed}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns>.btn{flex:1 1 140px}
.box{border:1.5px solid var(--line);border-radius:20px;background:rgba(14,16,44,.58);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:12px 14px;min-width:0}
.box.soft{background:rgba(14,16,44,.58);border-color:rgba(var(--rgb),.55);box-shadow:none}
.dash{border:2px dashed rgba(var(--rgb),.7);border-radius:22px;background:rgba(14,16,44,.45);padding:14px;min-width:0}
.hero{display:flex;align-items:center;gap:12px}
.hero .ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.hero h1{font-size:25px}
.av{position:relative;flex:none;width:58px;height:58px;border-radius:18px;border:1.5px solid rgba(200,210,255,.4);overflow:hidden;box-shadow:0 0 18px rgba(176,58,214,.45)}
.av::before{content:"";position:absolute;inset:0;background-size:150%;background-position:8% 30%;background-repeat:no-repeat;filter:grayscale(1) contrast(1.1)}
.av::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#1FA6C4,#5B3FE0 55%,#B03AD6);mix-blend-mode:color}
.logo-big{width:100%;max-width:300px;aspect-ratio:1;margin:0 auto;border-radius:44px;border:1.5px solid var(--line);box-shadow:0 0 40px rgba(176,58,214,.4);background-size:cover;background-position:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;min-height:92px;border-radius:18px;padding:10px 12px;text-align:left;width:100%;min-width:0;color:var(--ink)}
.tile .t-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tile .t-top small{font-size:14px;background:rgba(2,3,9,.65);border-radius:999px;padding:0 9px}
.tile .t-name{font-size:19px;line-height:1.1;overflow-wrap:anywhere}
.bar{height:11px;border-radius:999px;background:rgba(255,255,255,.07);border:1.5px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,rgba(var(--rgb),.55),rgba(var(--rgb),1));box-shadow:0 0 12px rgba(var(--rgb),.55);transition:width .3s}
.box .bar>i,.k-violet>.bar>i{--rgb:52,195,217}
.row{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:16px;background:rgba(14,16,44,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:8px 10px;min-width:0;text-align:left;width:100%;color:var(--ink)}
.row .r-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .r-t{font-size:18px;line-height:1.15;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column;gap:10px}
.thumb{flex:none;width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);object-fit:cover;background:rgba(var(--rgb),.3)}
.sec{border:1.5px solid rgba(var(--rgb),.6);border-radius:20px;background:rgba(14,16,44,.58);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:center;gap:10px}
.sec-h h3{flex:1;min-width:0}
.sec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:17px;line-height:1.55}
.sec>ul>li{padding-left:18px;position:relative}
.sec>ul>li::before{content:"";position:absolute;left:2px;top:.62em;width:8px;height:8px;border-radius:50%;background:rgba(var(--rgb),1);box-shadow:0 0 8px rgba(var(--rgb),.8)}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:15px;color:var(--ink2)}
.in{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:rgba(2,3,10,.6);padding:6px 12px}
.in.mono{font-family:var(--mono);font-size:14px}
textarea.in{min-height:70px;resize:vertical;line-height:1.3}
select.in{appearance:auto;color-scheme:dark}
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:9px 12px;font-size:16px;line-height:1.3;box-shadow:none}
.notice.err{--rgb:192,96,232}
.empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px}
.flip{position:relative;width:100%;min-height:300px;flex:1;border-radius:28px;padding:44px 20px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:var(--ink)}
.flip .tag{position:absolute;top:14px;left:16px;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(2,3,9,.7);border:1.5px solid rgba(var(--rgb),.7);border-radius:999px;padding:1px 12px;font-size:15px}
.flip .q{font-family:var(--display);font-size:32px;line-height:1.2;overflow-wrap:anywhere}
.flip .a{font-size:23px;line-height:1.35;overflow-wrap:anywhere}
.flip .code,.flip .formula{width:100%;text-align:left}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rate .btn{flex-direction:column;gap:0;min-height:58px;padding:4px 6px;font-size:18px;line-height:1.1}
.rate small{font-size:13px;color:var(--ink2)}
.week{display:flex;align-items:flex-end;justify-content:space-between;height:104px;gap:4px}
.week>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:15px}
.week i{display:block;width:70%;max-width:30px;min-height:6px;border:1.5px solid rgba(var(--rgb),.9);border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,rgba(var(--rgb),.65),rgba(var(--rgb),.2));box-shadow:0 0 10px rgba(var(--rgb),.35)}
.week i.z{background:transparent;border-style:dashed;border-color:var(--line);box-shadow:none}
.week .today{font-weight:700;text-decoration:underline}
.steps{display:flex;flex-direction:column;gap:10px;padding:12px 14px;margin:0;list-style:none}
.steps li{display:flex;align-items:center;gap:10px;font-size:18px}
.dot{flex:none;width:28px;height:28px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center}
.dot.on{border:1.5px solid rgba(52,195,217,.9);background:rgba(52,195,217,.35)}
.dot.ok{border:1.5px solid rgba(143,107,240,.9);background:rgba(143,107,240,.5)}
.dot.on::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--ink);animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.float{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
nav{flex:none;display:flex;justify-content:space-around;align-items:center;gap:2px;min-height:74px;background:rgba(6,8,24,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1.5px dashed var(--line);padding:4px 0}
nav button{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:68px;min-height:56px;padding:5px 8px;border:0;border-radius:16px;background:transparent;font-size:15px;color:var(--ink)}
nav button[aria-current="page"]{background:linear-gradient(145deg,rgba(52,195,217,.5),rgba(52,195,217,.16) 80%),rgba(10,12,34,.55);box-shadow:inset 0 0 0 1.5px rgba(52,195,217,.85),0 4px 16px rgba(52,195,217,.32)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:min(440px,calc(100vw - 32px));background:rgba(143,107,240,.95);color:#fff;border-radius:999px;padding:9px 18px;font-size:17px;z-index:20;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.toast[hidden]{display:none}
/* code */
.code{position:relative;background:#02030A;border:1.5px solid var(--line);border-radius:12px;min-width:0;max-width:100%}
.code .lang{position:absolute;top:6px;right:8px;font-family:var(--mono);font-size:11px;color:var(--ink2);background:rgba(var(--rgb),.25);border-radius:999px;padding:0 8px}
.code pre{margin:0;padding:26px 12px 10px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.6;color:#E8ECFF;-webkit-overflow-scrolling:touch}
.code code{font-family:inherit;white-space:pre}
.t-k{color:#34C3D9}.t-s{color:#C9A7FF}.t-c{color:#7D88C8;font-style:italic}.t-n{color:#8FB4FF}.t-f{color:#B795FF}
/* formules */
.formula{background:rgba(2,3,10,.6);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;overflow-x:auto;text-align:center}
.formula .small{text-align:left}
.tex{font-family:var(--mono);font-size:14px;color:#8FB4FF;overflow-wrap:anywhere}
.tex.ok{font-family:inherit;color:var(--ink);font-size:1.15em}
.tex .katex-display{margin:.3em 0}
/* schéma */
.sch{border:1.5px dashed rgba(var(--rgb),.75);border-radius:16px;background:rgba(2,3,10,.4);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.sch-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-size:19px}
.sch ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:0}
.sch li{width:min(100%,300px);text-align:center;border:1.5px solid rgba(var(--rgb),.85);background:linear-gradient(145deg,rgba(var(--rgb),.4),rgba(var(--rgb),.12));border-radius:999px;padding:5px 14px;display:flex;flex-direction:column;line-height:1.15}
.sch li small{font-size:14px;color:var(--ink2)}
.sch li+li{margin-top:22px;position:relative}
.sch li+li::before{content:"";position:absolute;left:50%;top:-20px;height:16px;border-left:2px solid rgba(var(--rgb),.9);transform:translateX(-50%)}
.sch li+li::after{content:"";position:absolute;left:50%;top:-6px;border:5px solid transparent;border-top:6px solid rgba(var(--rgb),.9);border-bottom:0;transform:translateX(-50%)}
.sch li.back{background:transparent;border-style:dashed;font-size:16px;padding:3px 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (min-width:520px){.app{border-left:1.5px dashed var(--line);border-right:1.5px dashed var(--line);padding:0 16px;background:rgba(4,5,15,.55)}}

const KWS = new Set(('if else elif for while do switch case default break continue return def class function fn let const var import from as in is not and or new try catch except finally throw throws raise with lambda yield async await public private protected static final abstract void int float double char long short bool boolean string struct enum typedef union include define extends implements interface package namespace using self this super null nil true false None True False NULL select insert update delete create table drop alter join inner left right outer on where group by order having limit values into set primary key foreign references distinct as unique index view begin commit rollback grant revoke like between exists all any union count sum avg min max then end when else begin').split(' '));
function hlCode(code, lang) {
  const l = String(lang || '').toLowerCase(); const hashC = /^(py|python|bash|sh|shell|zsh|ruby|rb|r|yaml|yml|toml|makefile|perl|powershell|ps1|dockerfile)$/.test(l); const dashC = /^(sql|plsql|mysql|postgres|postgresql|sqlite|haskell|hs|lua)$/.test(l); const sql = dashC && /sql|postgres|sqlite/.test(l);
  const cm = hashC ? '#[^\\n]*' : dashC ? '--[^\\n]*' : '\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/';
  const re = new RegExp('(' + cm + ')|("(?:\\\\.|[^"\\\\\\n])*"|\'(?:\\\\.|[^\'\\\\\\n])*\'|`(?:\\\\.|[^`\\\\])*`)|(\\b\\d+(?:\\.\\d+)?\\b)|(#\\w+)|([A-Za-z_]\\w*)', 'g');
  let out = '', pos = 0, m; code = String(code || '');
  while ((m = re.exec(code))) {
    out += esc(code.slice(pos, m.index)); pos = m.index + m[0].length; const t = m[0];
    if (m[1]) out += '<span class="t-c">' + esc(t) + '</span>';
    else if (m[2]) out += '<span class="t-s">' + esc(t) + '</span>';
    else if (m[3]) out += '<span class="t-n">' + esc(t) + '</span>';
    else if (m[4]) out += '<span class="t-k">' + esc(t) + '</span>';
    else if (KWS.has(sql ? t.toLowerCase() : t) || (sql && KWS.has(t.toLowerCase()))) out += '<span class="t-k">' + esc(t) + '</span>';
    else if (code[pos] === '(') out += '<span class="t-f">' + esc(t) + '</span>';
    else out += esc(t);
  }
  return out + esc(code.slice(pos));
}

function hl(text, kws) {
  text = String(text ?? ''); const low = text.toLowerCase(); const ranges = [];
  for (const k of kws || []) {
    const kk = String(k || '').trim().toLowerCase(); if (kk.length < 3) continue;
    const a = low.indexOf(kk); if (a < 0) continue; const b = a + kk.length;
    if (ranges.some(r => a < r[1] && b > r[0])) continue; ranges.push([a, b]);
  }
  ranges.sort((x, y) => x[0] - y[0]); let out = '', pos = 0;
  for (const [a, b] of ranges) { out += esc(text.slice(pos, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>'; pos = b; }
  return out + esc(text.slice(pos));
}

  ? `<div class="box soft k-magenta"><p>${label}</p><div class="btns" style="margin-top:8px"><button class="btn sm col k-magenta" data-act="${yes[0]}" ${yes[1] || ''}>Oui, confirmer</button><button class="btn sm" data-act="unconfirm">Annuler</button></div></div>` : '';
const mk = (txt, c) => `<mark class="k-${c}">${txt}</mark>`;

/* ---------- vues ---------- */
const VIEWS = {};
VIEWS.home = () => {
  const all = stats(S.docs); const last = docOf(S.last) || S.docs.find(d => !d.example) || S.docs[0];
  const tiles = SUBJECTS.map(s => `<button class="tile k-${s.color}" data-act="subject" data-id="${s.id}"><span class="t-top">${icon(s.icon, s.color, 34)}<small>${plural(docsOf(s.id).length, 'fiche', 'fiches')}</small></span><span class="t-name">${esc(s.name)}</span></button>`).join('');
  const lastBox = last ? (st => `<div class="box col k-violet"><p class="small">${last.example ? 'Fiche d\'exemple' : 'À reprendre'} · ${esc(SUBJ[last.subject].name)}</p><h2 style="margin:2px 0 8px">${esc(last.title)}</h2><div class="bar" aria-label="${st.pct} % maîtrisé"><i style="width:${st.pct}%"></i></div><p class="small" style="margin:6px 0 10px">${plural(st.n, 'carte', 'cartes')} · ${st.pct} % maîtrisé</p><button class="btn dark sm" data-act="doc" data-id="${last.id}">Continuer</button></div>`)(stats([last])) : '';
  const dueBox = all.due > 0 ? `<div class="box col k-teal" style="display:flex;align-items:center;gap:12px"><div style="flex:1;min-width:0"><h3>${plural(all.due, 'carte', 'cartes')} à réviser</h3><p class="small">C'est le bon moment pour réviser.</p></div><button class="btn sm dark" style="flex:none" data-act="review" data-scope="all">Réviser</button></div>` : '';
  return `<div class="hero"><div class="av" role="img" aria-label="Will-AI"></div><div class="ttl"><h1>Prêt à ${mk('réviser', 'teal')} ?</h1></div><button class="rnd k-violet" data-act="settings" aria-label="Réglages">${I.gear}</button><button class="rnd k-teal" data-act="goimport" aria-label="Importer un cours">${I.plus}</button></div>
  ${lastBox}${dueBox}
  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h2>Mes ${mk('matières', 'violet')}</h2><span class="pill k-sky small">Licence 3 · CNAM</span></div>
  <div class="grid2">${tiles}</div>`;
};
VIEWS.subject = p => {
  const s = SUBJ[p.id]; if (!s) return notFound(); const docs = docsOf(p.id).sort((a, b) => b.created - a.created); const st = stats(docs);
  const rows = docs.map(d => { const x = stats([d]); return `<button class="row" data-act="doc" data-id="${d.id}">${icon(d.sections[0] ? d.sections[0].icone : s.icon, d.sections[0] ? d.sections[0].couleur : s.color, 36)}<span class="r-main"><span class="r-t">${esc(d.title)}${d.example ? ' <span class="pill k-violet small">Exemple</span>' : ''}</span><span class="small muted">${plural(x.n, 'carte', 'cartes')} · ${x.pct} % maîtrisé · ${fmtDate(d.created)}</span></span>${I.chev}</button>`; }).join('');
  return `${topbar(esc(s.name))}
  ${docs.length ? `<div class="list">${rows}</div>` : empty('Aucune fiche ici pour l\'instant', 'Importe une photo ou un PDF de cours et l\'appli prépare ta fiche.')}
  <div class="btns">${st.n ? `<button class="btn dark" data-act="review" data-scope="subject" data-id="${s.id}">Réviser (${st.n})</button>` : ''}<button class="btn col k-${s.color}" data-act="goimport" data-subject="${s.id}">Importer un cours</button></div>`;
};
VIEWS.fiches = () => {
  const docs = [...S.docs].sort((a, b) => b.created - a.created);
  const rows = docs.map(d => { const s = SUBJ[d.subject]; const x = stats([d]); return `<button class="row k-${s.color}" data-act="doc" data-id="${d.id}">${icon(d.sections[0] ? d.sections[0].icone : s.icon, d.sections[0] ? d.sections[0].couleur : s.color, 36)}<span class="r-main"><span class="r-t">${esc(d.title)}${d.example ? ' <span class="pill k-violet small">Exemple</span>' : ''}</span><span class="small muted">${esc(s.name)} · ${plural(x.n, 'carte', 'cartes')} · ${fmtDate(d.created)}</span></span>${I.chev}</button>`; }).join('');
  return `<div class="hero"><div class="ttl"><h1>Mes ${mk('fiches', 'magenta')}</h1></div><button class="rnd k-teal" data-act="goimport" aria-label="Importer un cours">${I.plus}</button></div>${docs.length ? `<div class="list">${rows}</div>` : empty('Aucune fiche', 'Importe ton premier cours pour créer une fiche.', '<button class="btn dark" data-act="goimport">Importer un cours</button>')}`;
};
function notFound() { return `${topbar('Introuvable')}${empty('Cette page n\'existe plus', 'La fiche a peut-être été supprimée.', '<button class="btn dark" data-act="tab" data-tab="home">Retour à l\'accueil</button>')}`; }
function schemaHTML(sc, c) {
  if (!sc) return '';
  const nodes = sc.etapes.map(e => `<li><b>${esc(e.nom)}</b>${e.note ? `<small>${esc(e.note)}</small>` : ''}</li>`).join('');
  const back = sc.type === 'cycle' ? `<li class="back"><span>↻ retour à <b>${esc(sc.etapes[0].nom)}</b></span></li>` : '';
  return `<div class="sch k-${c}"><div class="sch-h"><span>${esc(sc.titre || 'Schéma')}</span><span class="pill k-${c} small">schéma</span></div><ol>${nodes}${back}</ol></div>`;
}
const formulaHTML = fs => fs.map(f => `<div class="formula">${f.nom ? `<span class="small muted">${esc(f.nom)}</span>` : ''}${tex(f.latex)}</div>`).join('');
VIEWS.fiche = p => {
  const d = docOf(p.id); if (!d) return notFound(); const s = SUBJ[d.subject];
  const secs = d.sections.map(x => `<section class="sec k-${x.couleur}"><div class="sec-h">${icon(x.icone, x.couleur, 38)}<h3>${esc(x.titre)}</h3></div>${x.points.length ? `<ul>${x.points.map(pt => `<li>${hl(pt, x.mots_cles)}</li>`).join('')}</ul>` : ''}${schemaHTML(x.schema, x.couleur)}${formulaHTML(x.formules)}${x.code ? codeBlock(x.code.texte, x.code.lang) : ''}</section>`).join('');
  const ret = d.retenir.length ? `<div class="box col k-teal"><h3 style="display:flex;align-items:center;gap:8px">${I.spark}À retenir</h3><ul style="margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px">${d.retenir.map(r => `<li style="display:flex;gap:8px;align-items:flex-start"><span style="flex:none;margin-top:1px">${I.check}</span><span>${esc(r)}</span></li>`).join('')}</ul></div>` : '';
  const subjOpts = SUBJECTS.map(x => `<option value="${x.id}"${x.id === d.subject ? ' selected' : ''}>${esc(x.name)}</option>`).join('');
  return `${topbar('Fiche', d.example ? '<span class="pill k-violet">Exemple</span>' : '')}
  <div style="text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center" class="k-${s.color}"><h1 style="font-size:38px"><mark>${esc(d.title)}</mark></h1>${d.subtitle ? `<p class="muted">${esc(d.subtitle)}</p>` : ''}<span class="pill k-${s.color}">${esc(s.name)}</span></div>
  ${secs}${ret}
  <div class="btns"><button class="btn dark" data-act="review" data-scope="doc" data-id="${d.id}">Réviser en flashcards (${d.cards.length})</button><button class="btn" data-act="edit" data-id="${d.id}">Modifier les cartes</button></div>
  <div class="dash" style="display:flex;flex-direction:column;gap:10px"><div class="field"><label for="chg-subj">Matière</label><select id="chg-subj" class="in" data-change="chg-subj" data-id="${d.id}">${subjOpts}</select></div>
  ${confirmRow('del-doc', 'Supprimer cette fiche et ses cartes ?', ['del-doc-yes', `data-id="${d.id}"`])}${ui.confirm === 'del-doc' ? '' : `<button class="btn sm ghost" data-act="confirm" data-key="del-doc">${I.trash} Supprimer la fiche</button>`}</div>`;
};
VIEWS.import = () => {
  const imp = ui.imp || (ui.imp = freshImp()); const pages = imp.files.reduce((n, f) => n + (f.err ? 0 : f.pages.length), 0);
  const files = imp.files.map(f => `<div class="row">${f.thumb ? `<img class="thumb" src="${f.thumb}" alt="">` : `<span class="thumb" style="display:flex;align-items:center;justify-content:center">${f.kind === 'pdf' ? '<small>PDF</small>' : ''}</span>`}<span class="r-main"><span class="r-t">${esc(f.name)}</span><span class="small muted">${f.busy ? 'Lecture en cours…' : f.err ? esc(f.err) : plural(f.pages.length, 'page', 'pages') + (f.note ? ' · ' + esc(f.note) : '')}</span></span><button class="rnd" style="width:44px;height:44px;box-shadow:none" data-act="rm-file" data-id="${f.id}" aria-label="Retirer ${esc(f.name)}">${I.close}</button></div>`).join('');
  const opts = `<option value="auto"${imp.subject === 'auto' ? ' selected' : ''}>Détecter automatiquement</option>` + SUBJECTS.map(x => `<option value="${x.id}"${imp.subject === x.id ? ' selected' : ''}>${esc(x.name)}</option>`).join('');
  const M = { key: ['k-teal', 'La fiche est générée avec ta clé Gemini (Google), gratuite dans la limite des quotas. Le contenu envoyé peut être utilisé par Google.'], nokey: ['k-magenta', 'Pour générer des fiches, ajoute ta clé Gemini (gratuite) dans les réglages. Elle reste sur ton téléphone.'] }[ai.mode];
  return `${topbar(mk('Importer', 'violet') + ' un cours')}
  <p class="muted">Une photo ou un PDF, et Will-AI en fait une fiche de révision.</p>
  <div class="dash" style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center"><div class="float">${icon('book', 'violet', 64)}</div><h3>Dépose ton cours ici</h3><div class="btns" style="width:100%"><button class="btn col k-blue" data-act="pick-photo">${I.camera} Photo</button><button class="btn col k-teal" data-act="pick-file">${I.file} PDF</button></div></div>
  ${imp.files.length ? `<div class="list"><h3>Mes fichiers</h3>${files}<p class="small muted">${plural(pages, 'page prête', 'pages prêtes')} · maximum ${ai.maxImages} pages lues par l'IA</p></div>` : ''}
  <div class="field"><label for="imp-subj">Matière</label><select id="imp-subj" class="in" data-change="imp-subj">${opts}</select></div>
  <div class="notice ${M[0]}">${I.spark}<span>${M[1]}</span></div>
  ${ai.mode === 'nokey' ? '<button class="btn sm" data-act="settings">Ouvrir les réglages</button>' : ''}
  ${ui.impErr ? `<div class="notice err" role="alert">${esc(ui.impErr)}</div>` : ''}
  <button class="btn dark" data-act="generate">${I.spark} Générer ma fiche</button>`;
};
VIEWS.gen = () => {
  const g = ui.gen; if (!g) return notFound();
  if (g.error) return `${topbar('Génération', '', true)}<div class="notice err" role="alert"><span>${esc(g.error)}</span></div><button class="btn dark" data-act="retry-gen">Revenir à l'import</button>`;
  const pct = Math.min(92, 18 + Math.round((g.chars || 0) / 55));
  return `${topbar('Génération', '', true)}<div style="display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center"><div class="float">${icon('cpu', 'violet', 120)}</div><h1>Ta ${mk('fiche', 'teal')} se prépare…</h1><p class="muted">Ça peut prendre jusqu'à une minute.</p></div>
  <div><div style="display:flex;justify-content:space-between" class="small"><span id="gtxt">${g.chars ? 'Rédaction en cours…' : 'Lecture des pages…'}</span><span>estimation</span></div><div class="bar"><i id="gbar" style="width:${pct}%"></i></div></div>
  <ol class="steps box soft k-violet"><li><span class="dot ok">${SVG('<path d="M5 12l5 5L19 7"/>', 14, 3.4)}</span>Pages préparées</li><li><span class="dot ${g.chars ? 'ok' : 'on'}">${g.chars ? SVG('<path d="M5 12l5 5L19 7"/>', 14, 3.4) : ''}</span>Lecture du cours par l'IA</li><li><span class="dot ${g.chars ? 'on' : ''}"></span>Schémas, formules et extraits de code</li><li><span class="dot"></span>Création des flashcards</li></ol>
  <button class="btn" data-act="cancel-gen">Annuler</button>`;
};
function progressTick() { const g = ui.gen; if (!g || route.name !== 'gen') return; const b = $('#gbar'); if (b) b.style.width = Math.min(92, 18 + Math.round((g.chars || 0) / 55)) + '%'; const t = $('#gtxt'); if (t) t.textContent = 'Rédaction en cours…'; }

/* révision */
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function startReview(scope, id, force) {
  let docs = scope === 'doc' ? [docOf(id)] : scope === 'subject' ? docsOf(id) : S.docs;
  docs = docs.filter(Boolean); let items = [];
  docs.forEach(d => d.cards.forEach(c => { if (force || isDue(c)) items.push({ doc: d.id, card: c.id, tries: 0, box: c.box }); }));
  items = shuffle(items).sort((a, b) => a.box - b.box).slice(0, 30);
  ui.rev = { scope, id, force: !!force, queue: items, i: 0, flipped: false, counts: { again: 0, hard: 0, good: 0 } };
  go('review', {}, { replace: route.name === 'review' });
}
VIEWS.review = () => {
  const r = ui.rev; if (!r) return VIEWS.cards();
  if (!r.queue.length) return `${topbar('Révision')}${empty(r.force ? 'Aucune carte' : 'Rien à réviser pour le moment', r.force ? 'Cette sélection ne contient pas encore de cartes.' : 'Toutes tes cartes sont à jour. Reviens demain, ou révise quand même.', r.force ? '' : `<button class="btn dark" data-act="review-force">Réviser quand même</button>`)}`;
  let it = r.queue[r.i], found = null;
  while (it && !(found = findCard(it))) { r.i++; it = r.queue[r.i]; }
  if (!it) { const c = r.counts; const t = c.again + c.hard + c.good; return `${topbar('Terminé', '', true)}<div class="empty"><div class="float">${icon('star', 'teal', 84)}</div><h1>Bravo, ${mk('session terminée', 'teal')}</h1><p class="muted">${plural(t, 'carte revue', 'cartes revues')}</p></div><div class="grid2"><div class="box col k-magenta"><h2>${c.again}</h2><p class="small">à revoir</p></div><div class="box col k-teal"><h2>${c.good}</h2><p class="small">sues</p></div></div><div class="btns"><button class="btn dark" data-act="tab" data-tab="progress">Voir ma progression</button><button class="btn" data-act="end-review">Terminer</button></div>`; }
  const { doc, card } = found; const s = SUBJ[doc.subject]; const left = r.queue.length - r.i;
  const back = `<span class="tag">Réponse</span>${card.a ? `<p class="a">${esc(card.a)}</p>` : ''}${card.f ? `<div class="formula in-card">${tex(card.f)}</div>` : ''}${card.code ? codeBlock(card.code, card.lang) : ''}`;
  const face = r.flipped ? `<div class="flip grow k-teal" data-act="flip" role="button" tabindex="0" aria-label="Retourner la carte">${back}</div>` : `<div class="flip grow k-${s.color}" data-act="flip" role="button" tabindex="0" aria-label="Retourner la carte"><span class="tag">${esc(doc.title)}</span><p class="q">${esc(card.q)}</p><p class="small muted">Touche la carte pour la retourner</p></div>`;
  const rating = r.flipped ? `<div class="rate"><button class="btn col k-magenta" data-act="rate" data-r="again">À revoir<small>${nextLabel(card, 'again')}</small></button><button class="btn col k-sky" data-act="rate" data-r="hard">Hésitant<small>${nextLabel(card, 'hard')}</small></button><button class="btn col k-teal" data-act="rate" data-r="good">Je sais<small>${nextLabel(card, 'good')}</small></button></div>` : `<button class="btn dark" data-act="flip">Retourner la carte</button>`;
  return `${topbar(esc(r.scope === 'doc' ? doc.title : 'Révision'), `<span class="pill k-violet">${left} restante${left > 1 ? 's' : ''}</span>`)}<div class="bar"><i style="width:${Math.round(r.i / r.queue.length * 100)}%"></i></div>${face}${rating}`;
};
function findCard(it) { const doc = docOf(it.doc); const card = doc && doc.cards.find(c => c.id === it.card); return card ? { doc, card } : null; }
VIEWS.cards = () => {
  const all = stats(S.docs); const rows = S.docs.filter(d => d.cards.length).map(d => { const x = stats([d]); const s = SUBJ[d.subject]; return `<div class="row">${icon(d.sections[0] ? d.sections[0].icone : s.icon, d.sections[0] ? d.sections[0].couleur : s.color, 34)}<span class="r-main"><span class="r-t">${esc(d.title)}</span><span class="small muted">${plural(x.n, 'carte', 'cartes')} · ${x.due} à réviser</span></span><button class="btn sm col k-${s.color}" data-act="review" data-scope="doc" data-id="${d.id}">Réviser</button></div>`; }).join('');
  return `<div class="hero"><div class="ttl"><h1>Mes ${mk('cartes', 'sky')}</h1></div></div>
  <div class="box col ${all.due ? 'k-teal' : 'k-violet'}"><h2>${all.due ? plural(all.due, 'carte', 'cartes') + ' à réviser' : 'Tout est à jour'}</h2><p class="small" style="margin:2px 0 10px">${plural(all.n, 'carte', 'cartes')} au total · ${all.pct} % maîtrisées</p>${all.n ? `<button class="btn dark" data-act="review" data-scope="all" ${all.due ? '' : 'data-force="1"'}>${all.due ? 'Lancer la révision du jour' : 'Réviser quand même'}</button>` : ''}</div>
  ${rows ? `<div class="list"><h3>Par fiche</h3>${rows}</div>` : empty('Pas encore de cartes', 'Les cartes sont créées avec tes fiches.', '<button class="btn dark" data-act="goimport">Importer un cours</button>')}`;
};
VIEWS.edit = p => {
  const d = docOf(p.id); if (!d) return notFound();
  const rows = d.cards.map(c => {
    if (ui.editing === c.id) return `<div class="box soft k-violet" style="display:flex;flex-direction:column;gap:8px"><span class="pill k-violet small" style="align-self:flex-start">En cours de modification</span><div class="field"><label for="eq">Question</label><textarea id="eq" class="in">${esc(c.q)}</textarea></div><div class="field"><label for="ea">Réponse</label><textarea id="ea" class="in">${esc(c.a)}</textarea></div><div class="field"><label for="ec">Extrait de code (optionnel)</label><textarea id="ec" class="in mono" spellcheck="false" autocapitalize="off">${esc(c.code)}</textarea></div><div class="field"><label for="el">Langage du code (c, python, sql…)</label><input id="el" class="in" autocapitalize="off" spellcheck="false" value="${esc(c.lang)}"></div><div class="field"><label for="ef">Formule LaTeX (optionnel)</label><input id="ef" class="in mono" autocapitalize="off" spellcheck="false" value="${esc(c.f)}"></div><div class="btns"><button class="btn sm col k-teal" data-act="card-save" data-id="${c.id}">Enregistrer</button><button class="btn sm" data-act="card-cancel">Annuler</button></div></div>`;

    return `<div class="row"><span class="r-main"><span class="r-t">${esc(c.q)}</span><span class="small muted">${esc(c.a || (c.f ? 'Formule' : 'Code'))}${c.code ? ' · &lt;/&gt;' : ''}${c.f && c.a ? ' · Σ' : ''}</span></span><button class="rnd k-sky" style="width:44px;height:44px" data-act="card-edit" data-id="${c.id}" aria-label="Modifier la carte">${I.edit}</button><button class="rnd k-magenta" style="width:44px;height:44px" data-act="confirm" data-key="cd-${c.id}" aria-label="Supprimer la carte">${I.trash}</button></div>`;
  }).join('');
  const add = ui.adding ? `<div class="box soft k-teal" style="display:flex;flex-direction:column;gap:8px"><div class="field"><label for="nq">Question</label><textarea id="nq" class="in"></textarea></div><div class="field"><label for="na">Réponse</label><textarea id="na" class="in"></textarea></div><div class="field"><label for="nc">Extrait de code (optionnel)</label><textarea id="nc" class="in mono" spellcheck="false" autocapitalize="off"></textarea></div><div class="field"><label for="nl">Langage du code</label><input id="nl" class="in" autocapitalize="off" spellcheck="false"></div><div class="field"><label for="nf">Formule LaTeX (optionnel)</label><input id="nf" class="in mono" autocapitalize="off" spellcheck="false"></div>${ui.impErr ? `<div class="notice err" role="alert">${esc(ui.impErr)}</div>` : ''}<div class="btns"><button class="btn sm col k-teal" data-act="card-add-save" data-id="${d.id}">Ajouter</button><button class="btn sm" data-act="card-add-cancel">Annuler</button></div></div>` : `<button class="btn ghost" data-act="card-add-open">${I.plus} Ajouter une carte</button>`;
  return `${topbar('Mes ' + mk('cartes', 'magenta'), `<span class="pill k-sky">${plural(d.cards.length, 'carte', 'cartes')}</span>`)}<p class="muted">${esc(d.title)}</p><div class="list">${rows}</div>${add}<button class="btn dark" data-act="review" data-scope="doc" data-id="${d.id}">Réviser ces cartes</button>`;
};
VIEWS.progress = () => {
  const n = streak(); const wk = weekBars(); const max = Math.max(1, ...wk.map(w => w.n)); const all = stats(S.docs); const wkTotal = wk.reduce((a, w) => a + w.n, 0);
  const subs = SUBJECTS.map(s => ({ s, st: stats(docsOf(s.id)) })).filter(x => x.st.n).sort((a, b) => a.st.pct - b.st.pct);
  const bars = subs.map(({ s, st }) => `<div class="k-${s.color}"><div style="display:flex;justify-content:space-between;gap:8px"><span style="min-width:0;overflow-wrap:anywhere">${esc(s.name)}</span><span style="flex:none;white-space:nowrap">${st.pct} %</span></div><div class="bar"><i style="width:${st.pct}%"></i></div></div>`).join('');
  const cols = ['teal', 'blue', 'violet', 'magenta', 'sky'];
  return `<div class="hero"><div class="ttl"><h1>Mes ${mk('progrès', 'violet')}</h1></div></div>

/* ---------- rendu ---------- */
function render(reset) {

  if (reset) { v.scrollTop = 0; v.classList.remove('view-in'); void v.offsetWidth; v.classList.add('view-in'); }

/* ---------- actions ---------- */
async function addFiles(list) {
  const imp = ui.imp || (ui.imp = freshImp());
  for (const f of Array.from(list || [])) {
    const used = imp.files.reduce((n, x) => n + (x.err ? 0 : x.pages.length), 0); const room = Math.max(0, ai.maxImages - used);
    const e = { id: uid(), name: f.name || 'photo.jpg', kind: (f.type === 'application/pdf' || /\.pdf$/i.test(f.name || '')) ? 'pdf' : 'img', pages: [], busy: true, err: '', note: '', thumb: '' };
    imp.files.push(e); ui.impErr = ''; if (route.name === 'import') render();
    try {
      if (room < 1) throw new Error('full');
      if (e.kind === 'pdf') { const r = await pdfToBlobs(f, room); e.pages = r.blobs; if (r.total > r.blobs.length) e.note = 'seules les ' + r.blobs.length + ' premières pages sont lues'; }
      else e.pages = [await imgToBlob(f)];
      if (e.pages[0]) e.thumb = URL.createObjectURL(e.pages[0]);
    } catch (err) { console.warn('import', err && (err.message || err)); e.err = err && err.message === 'full' ? 'Limite de pages atteinte' : 'Fichier illisible'; }
    e.busy = false; if (route.name === 'import') render();
  }
}
async function generate() {
  const imp = ui.imp || (ui.imp = freshImp()); const blobs = imp.files.flatMap(f => f.err || f.busy ? [] : f.pages);
  if (imp.files.some(f => f.busy)) { ui.impErr = 'Patiente un instant, les fichiers sont en cours de lecture.'; return render(); }
  if (!blobs.length) { ui.impErr = 'Ajoute au moins une photo ou un PDF lisible.'; return render(); }
  if (ai.mode !== 'key') { ui.impErr = 'Ajoute d\'abord ta clé API Gemini dans les réglages.'; return render(); }
  ui.impErr = ''; const gen = ui.gen = { chars: 0, error: '', ctl: new AbortController() }; go('gen');
  try {
    const raw = await genKey(blobs, buildPrompt(imp.subject), gen);
    const doc = buildDoc(raw, imp); S.docs.unshift(doc); S.last = doc.id; saveState();
    imp.files.forEach(f => f.thumb && URL.revokeObjectURL(f.thumb)); ui.imp = null; ui.gen = null; hist.length = 0; route = { name: 'fiche', p: { id: doc.id } }; render(true); toast('Ta fiche est prête');
  } catch (e) {
    if (e && e.code === 'cancelled') { if (route.name === 'gen') back(); return; }
    gen.error = friendly(e); if (route.name === 'gen') render();
  }
}
const ACT = {
  tab: (d) => tab(d.tab), back: () => back(), unconfirm: () => { ui.confirm = ''; render(); }, confirm: (d) => { ui.confirm = d.key; render(); },
  settings: () => go('settings'), subject: d => go('subject', { id: d.id }),
  doc: d => { S.last = d.id; saveState(); go('fiche', { id: d.id }); },
  goimport: d => { ui.imp = freshImp(d.subject || 'auto'); ui.impErr = ''; go('import'); },
  'pick-photo': () => $('#in-photo').click(), 'pick-file': () => $('#in-file').click(), 'pick-backup': () => $('#in-backup').click(),
  'rm-file': d => { const imp = ui.imp; const f = imp.files.find(x => x.id === d.id); if (f && f.thumb) URL.revokeObjectURL(f.thumb); imp.files = imp.files.filter(x => x.id !== d.id); render(); },
  generate: () => generate(), 'cancel-gen': () => { if (ui.gen) ui.gen.ctl.abort(); }, 'retry-gen': () => { ui.gen = null; go('import', {}, { replace: true }); },
  review: d => startReview(d.scope, d.id, !!d.force), 'review-force': () => startReview(ui.rev.scope, ui.rev.id, true),
  flip: () => { ui.rev.flipped = !ui.rev.flipped; render(); },
  rate: d => { const r = ui.rev; const it = r.queue[r.i]; const f = findCard(it); if (!f) { r.i++; return render(); } rate(f.card, d.r); r.counts[d.r]++; if (d.r === 'again' && it.tries < 2) r.queue.push({ ...it, tries: it.tries + 1 }); r.i++; r.flipped = false; saveState(); render(true); },
  'end-review': () => { ui.rev = null; hist.length = 0; route = { name: 'cards', p: {} }; render(true); },
  edit: d => go('edit', { id: d.id }),
  'card-edit': d => { ui.editing = d.id; ui.confirm = ''; render(); }, 'card-cancel': () => { ui.editing = ''; render(); },
  'card-save': d => { const doc = docOf(route.p.id); const c = doc.cards.find(x => x.id === d.id); const q = str($('#eq').value, 260), a = str($('#ea').value, 340), code = keepText($('#ec').value, 500), f = keepText($('#ef').value, 200).replace(/\n/g, ' '); if (!q || !(a || code || f)) { toast('Écris une question et une réponse'); return; } c.q = q; c.a = a; c.code = code; c.lang = str($('#el').value, 16).toLowerCase(); c.f = f; ui.editing = ''; saveState(); render(); toast('Carte enregistrée'); },
  'card-del-yes': d => { const doc = docOf(route.p.id); doc.cards = doc.cards.filter(c => c.id !== d.id); ui.confirm = ''; saveState(); render(); toast('Carte supprimée'); },
  'card-add-open': () => { ui.adding = true; ui.impErr = ''; render(); }, 'card-add-cancel': () => { ui.adding = false; ui.impErr = ''; render(); },
  'card-add-save': d => { const q = str($('#nq').value, 260), a = str($('#na').value, 340), code = keepText($('#nc').value, 500), f = keepText($('#nf').value, 200).replace(/\n/g, ' '); if (!q || !(a || code || f)) { ui.impErr = 'Écris une question et une réponse.'; render(); return; } docOf(d.id).cards.push({ id: uid(), q, a, code, lang: str($('#nl').value, 16).toLowerCase(), f, box: 0, due: 0, reps: 0 }); ui.adding = false; ui.impErr = ''; saveState(); render(); toast('Carte ajoutée'); },
  'del-doc-yes': d => { S.docs = S.docs.filter(x => x.id !== d.id); if (S.last === d.id) S.last = ''; ui.confirm = ''; saveState(); hist.length = 0; route = { name: 'fiches', p: {} }; render(true); toast('Fiche supprimée'); },
  'save-key': () => { S.settings.gkey = ($('#key').value || '').trim(); S.settings.gmodel = ($('#model').value || '').trim() || 'gemini-3.8-flash'; saveState(); initAI(); toast(S.settings.gkey ? 'Clé enregistrée' : 'Clé effacée'); },
  'test-key': async () => { S.settings.gkey = ($('#key').value || '').trim(); S.settings.gmodel = ($('#model').value || '').trim() || 'gemini-3.8-flash'; saveState(); ui.keyTest = { ok: true, msg: 'Test en cours (15 s maximum par étape)…' }; render();
    const K = S.settings.gkey, root = 'https://generativelanguage.googleapis.com/v1beta/';
    const call = async (url, init) => { const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000); try { const r = await fetch(url, { ...init, signal: ctl.signal }); const txt = await r.text().catch(() => ''); let j = null; try { j = JSON.parse(txt); } catch (e) { /* pas du JSON */ } return { status: r.status, ok: r.ok, err: j && j.error ? (j.error.status || '') + ' ' + String(j.error.message || '').slice(0, 140) : txt.slice(0, 100) }; }
      catch (e) { return { status: 0, ok: false, err: e && e.name === 'AbortError' ? 'pas de réponse après 15 s' : 'connexion bloquée (' + String(e && e.message) + ')' }; } finally { clearTimeout(t); } };
    const lines = [];
    const a = await call(root + 'models?pageSize=1&key=' + encodeURIComponent(K), { method: 'GET' });
    lines.push('Étape 1, clé : ' + (a.ok ? 'acceptée' : 'échec, ' + (a.status || 'aucune réponse') + ' ' + a.err));
    const body = JSON.stringify({ contents: [{ parts: [{ text: 'Réponds par le mot OK.' }] }] }); const u = root + 'models/' + encodeURIComponent(S.settings.gmodel) + ':generateContent';
    const b = await call(u, { method: 'POST', headers: { 'content-type': 'application/json', 'x-goog-api-key': K }, body });
    lines.push('Étape 2, modèle (en-tête) : ' + (b.ok ? 'OK' : 'échec, ' + (b.status || 'aucune réponse') + ' ' + b.err));
    if (!b.ok) { const c = await call(u + '?key=' + encodeURIComponent(K), { method: 'POST', headers: { 'content-type': 'text/plain;charset=UTF-8' }, body }); lines.push('Étape 3, modèle (adresse) : ' + (c.ok ? 'OK' : 'échec, ' + (c.status || 'aucune réponse') + ' ' + c.err)); }
    ui.keyTest = { ok: lines.every(l => !/échec/.test(l)), msg: lines.join(' | ') }; if (route.name === 'settings') render(); },
  'clear-key': () => { S.settings.gkey = ''; saveState(); initAI(); render(); toast('Clé effacée'); },
  export: async () => { const data = JSON.stringify({ app: 'will-ai', v: 1, docs: S.docs, reviews: S.reviews }, null, 1); const r = await saveFile('will-ai-sauvegarde.json', data); if (r === 'saved') toast('Sauvegarde exportée'); },
  'backup-yes': () => { S.docs = ui.pendingBackup.docs; S.reviews = ui.pendingBackup.reviews; S.seeded = true; ui.pendingBackup = null; saveState(); render(); toast('Sauvegarde restaurée'); }, 'backup-no': () => { ui.pendingBackup = null; render(); },
  'restore-demo': () => { S.docs.push(cleanDoc(DEMO)); saveState(); render(); toast('Exemple remis'); },
  'reset-yes': () => { const k = S.settings; S = DEFAULT(); S.settings = k; S.seeded = true; ui.confirm = ''; saveState(); hist.length = 0; route = { name: 'home', p: {} }; render(true); toast('Données effacées'); }
};
async function saveFile(name, text) {
  try { const file = new File([text], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return 'saved'; } }
  catch (e) { if (e && e.name === 'AbortError') return 'declined'; }
  try { const url = URL.createObjectURL(new Blob([text], { type: 'application/json' })); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); return 'saved'; }
  catch (e) { toast('Export impossible ici'); return 'failed'; }
}
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t) return; const fn = ACT[t.dataset.act]; if (fn) { e.preventDefault(); fn(t.dataset, t); } });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('change', e => {
  const t = e.target; const k = t.dataset && t.dataset.change; if (!k) return;

  else if (k === 'chg-subj') { const d = docOf(t.dataset.id); d.subject = SUBJ[t.value] ? t.value : d.subject; saveState(); render(); toast('Matière modifiée'); }
});

$('#in-backup').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const o = JSON.parse(await f.text()); if (o.app !== 'will-ai') throw new Error('autre appli'); const docs = (Array.isArray(o.docs) ? o.docs : []).map(cleanDoc).filter(Boolean); if (!docs.length && !Object.keys(o.reviews || {}).length) throw new Error('vide'); const reviews = {}; Object.entries(o.reviews || {}).forEach(([k, v]) => { if (/^\d{4}-\d{2}-\d{2}$/.test(k) && Number(v) > 0) reviews[k] = Math.min(9999, Math.floor(Number(v))); }); ui.pendingBackup = { docs, reviews }; render(); }
